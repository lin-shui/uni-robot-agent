[project]
name = "uni-robot-agent"
version = "0.1.1"
description = "A unified harness for robot-use agents, with CLI, Python SDK, and live monitoring"
readme = "docs/pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["robotics", "agents", "mcp", "embodied-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0.0",
    "huggingface-hub>=0.28,<2",
    "numpy>=1.24",
    "pillow>=10",
    "pydantic>=2,<3",
    "jsonschema>=4.18",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.29,<1",
    "openai-codex==0.147.0",
    "claude-agent-sdk==0.2.165",
    "textual>=0.70.0",
]

[project.urls]
Documentation = "https://uni-robot-agent.com/docs"
Homepage = "https://uni-robot-agent.com/"

[project.optional-dependencies]
# Compatibility extras: the base package already includes these features.
tui = []
codex = []
claude = []
# The steward adapter launches the dsh runtime through its Python SDK.
steward = ["deepseek-harness-sdk>=0.2.1rc2"]
dev = ["build>=1", "twine>=6", "tomli-w>=1"]
robolab = ["scipy>=1.10", "trimesh>=4,<5", "python-fcl>=0.7,<0.8"]
robodojo = [
    "trimesh>=4,<5",
    "imageio>=2.0",
    "scipy>=1.10",
    "imageio-ffmpeg>=0.4",
]

[project.entry-points."robouse.backends"]
uni_robot_agent_worker = "uni_robot_agent.integrations.robouse.environment.backends.worker_backend:WorkerBackend"

[project.scripts]
uni-robot-agent = "uni_robot_agent.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["uni_robot_agent*"]
namespaces = false

[tool.setuptools.package-data]
"uni_robot_agent.ui.web" = ["static/*.html", "static/*.js", "static/*.css"]
"uni_robot_agent" = ["py.typed"]
"uni_robot_agent.resources" = ["prompts/**/*.md", "prompts/robodojo/task_requirements.json", "prompts/robodojo/instruction_supplements.json", "skills/**/*.md"]
"uni_robot_agent.integrations.robolab" = ["SOURCE.md"]
"uni_robot_agent.integrations.robodojo" = ["deployment.toml", "SOURCE.md", "UPSTREAM_LICENSE", "environment/*.urdf"]

"uni_robot_agent.integrations.robouse" = ["recipes/*.toml"]
"uni_robot_agent.services.actor" = ["recipes/*.toml"]
"uni_robot_agent.services.perception" = ["recipes/*.toml"]

# Native services run in separate environments without planner/UI dependencies.
[tool.uni-robot-agent.runtime]
exclude-dependencies = ["openai-codex", "claude-agent-sdk", "textual"]
